name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # 刻意不安裝 PySide6：core/ 若不小心 import 了 Qt，這個 job 會紅燈。
    # 這是「領域核心不依賴 UI 框架」(NF-01) 的持續驗證。
    name: 核心邏輯（無 Qt）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安裝測試工具
        run: python -m pip install --upgrade pip pytest
      - name: 確認 core 層沒有相依 Qt
        run: |
          if grep -rn "PySide6\|PyQt" stephany/core/; then
            echo "::error::stephany/core/ 不得 import Qt（NF-01）"
            exit 1
          fi
      - name: 執行核心測試
        run: |
          python -m pytest \
            tests/test_widths.py \
            tests/test_block.py \
            tests/test_bookmarks.py \
            tests/test_macro.py \
            tests/test_folding.py \
            tests/test_packaging.py \
            -q

  gui:
    name: GUI 層（offscreen）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 安裝 Qt 執行期的系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 fonts-noto-cjk
      - name: 安裝 Python 相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: 執行全套測試
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
