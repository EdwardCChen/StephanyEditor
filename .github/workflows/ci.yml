name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # 刻意不安裝 PySide6：core/ 若不小心 import 了 Qt，這個 job 會紅燈。
    # 這是「領域核心不依賴 UI 框架」(NF-01) 的持續驗證。
    name: 核心邏輯（無 Qt）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安裝測試工具
        run: python -m pip install --upgrade pip pytest
      - name: 確認 core 層沒有相依 Qt
        run: |
          if grep -rn "PySide6\|PyQt" stephany/core/ stephany/platforms.py; then
            echo "::error::core/ 與 platforms.py 不得 import Qt（NF-01）"
            exit 1
          fi
      - name: 執行核心測試
        run: |
          python -m pytest \
            tests/test_widths.py \
            tests/test_block.py \
            tests/test_bookmarks.py \
            tests/test_macro.py \
            tests/test_folding.py \
            tests/test_packaging.py \
            tests/test_packaging_macos.py \
            tests/test_platform.py \
            -q

  gui:
    name: GUI 層（offscreen）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 安裝 Qt 執行期的系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 fonts-noto-cjk
      - name: 安裝 Python 相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: 執行全套測試
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  macos:
    # SRS-005 NF-03：macOS 的差異（字型度量、⌘ 對映、選單角色）只有在真的
    # 跑在 macOS 上才驗得到，在 Linux 上跑一百次也不會發現。
    name: macOS（offscreen）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 安裝 Python 相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: 安裝一個 CJK 等寬字型
        # runner 的映像是精簡過的，沒有 macOS 桌面版才有的 Osaka 字型資產，
        # 字型不變量的測試會因此 skip。裝一個確定是全形等寬的字型讓它真的跑得到。
        # 裝不起來也不擋 CI——那個測試會自己 skip，不會變成假紅燈。
        run: brew install --cask font-sarasa-gothic || echo "字型安裝失敗，字型量測測試會 skip"
      - name: 這台 runner 看得到哪些偏好字型
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          from PySide6.QtGui import QFontDatabase, QGuiApplication
          app = QGuiApplication(sys.argv[:1])
          from stephany import platforms
          for family, style in platforms.PREFERRED_FONTS:
              have = family in QFontDatabase.families() and (
                  style is None or style in QFontDatabase.styles(family)
              )
              print(f"{'有' if have else '無'}  {family} / {style or '預設樣式'}")
          print("Osaka 的樣式：", QFontDatabase.styles("Osaka"))
          PY
      - name: 執行全套測試
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  macos-app:
    # F-MAC-10：建構腳本必須在乾淨的 macOS 上、沒有額外打包工具、不用 root
    # 的情況下跑得起來；並驗證產出的 .app 結構符合 D-01 / D-02。
    name: macOS .app 建構
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 建置 .app
        run: ./packaging/build-app.sh
      - name: 驗證 bundle 結構
        run: |
          APP="dist/Stephany Editor.app"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/pyvenv.cfg"                      # D-02
          test -f "$APP/Contents/Resources/stephany-editor.icns"
          # D-01：Contents/MacOS 底下必須是執行檔（Mach-O），不是 shell 腳本
          file "$APP/Contents/MacOS/stephany-editor" | grep -q "Mach-O"
          # BR-MAC-2：不得帶進建構期的殘留
          ! test -d "$APP/Contents/bin"
          ! find "$APP" -name '__pycache__' -type d | grep -q .
          # F-MAC-12：Qt 的繁中翻譯要跟著進 bundle，否則選單會變英文
          ls "$APP"/Contents/lib/python*/site-packages/PySide6/Qt/translations/qtbase_zh_TW.qm
      - name: 終端機進入點可以執行（F-MAC-05）
        run: |
          "dist/Stephany Editor.app/Contents/Resources/bin/stephany-editor" --version
