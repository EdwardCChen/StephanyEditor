name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # 刻意不安裝 PySide6：core/ 若不小心 import 了 Qt，這個 job 會紅燈。
    # 這是「領域核心不依賴 UI 框架」(NF-01) 的持續驗證。
    name: 核心邏輯（無 Qt）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安裝測試工具
        run: python -m pip install --upgrade pip pytest
      - name: 確認 core 層沒有相依 Qt
        run: |
          if grep -rn "PySide6\|PyQt" stephany/core/ stephany/platforms.py; then
            echo "::error::core/ 與 platforms.py 不得 import Qt（NF-01）"
            exit 1
          fi
      - name: 執行核心測試
        run: |
          python -m pytest \
            tests/test_widths.py \
            tests/test_block.py \
            tests/test_bookmarks.py \
            tests/test_macro.py \
            tests/test_folding.py \
            tests/test_packaging.py \
            tests/test_packaging_macos.py \
            tests/test_packaging_windows.py \
            tests/test_platform.py \
            -q -rs

  gui:
    name: GUI 層（offscreen）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 安裝 Qt 執行期的系統相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 fonts-noto-cjk
      - name: 安裝 Python 相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: 執行全套測試
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -rs

  macos:
    # SRS-005 NF-03：macOS 的差異（字型度量、⌘ 對映、選單角色）只有在真的
    # 跑在 macOS 上才驗得到，在 Linux 上跑一百次也不會發現。
    name: macOS（offscreen）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 安裝 Python 相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: 安裝一個 CJK 等寬字型
        # runner 的映像是精簡過的，沒有 macOS 桌面版才有的 Osaka 字型資產，
        # 字型不變量的測試會因此 skip。裝一個確定是全形等寬的字型讓它真的跑得到。
        # 裝不起來也不擋 CI——那個測試會自己 skip，不會變成假紅燈。
        run: brew install --cask font-sarasa-gothic || echo "字型安裝失敗，字型量測測試會 skip"
      - name: 這台 runner 看得到哪些偏好字型
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          from PySide6.QtGui import QFontDatabase, QGuiApplication
          app = QGuiApplication(sys.argv[:1])
          from stephany import platforms
          for family, style in platforms.PREFERRED_FONTS:
              have = family in QFontDatabase.families() and (
                  style is None or style in QFontDatabase.styles(family)
              )
              print(f"{'有' if have else '無'}  {family} / {style or '預設樣式'}")
          print("Osaka 的樣式：", QFontDatabase.styles("Osaka"))
          PY
      - name: 執行全套測試
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -rs

  macos-app:
    # F-MAC-10：建構腳本必須在乾淨的 macOS 上、沒有額外打包工具、不用 root
    # 的情況下跑得起來；並驗證產出的 .app 結構符合 D-01 / D-02。
    name: macOS .app 建構
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 建置 .app
        run: ./packaging/build-app.sh
      - name: 驗證 bundle 結構
        run: |
          APP="dist/Stephany Editor.app"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/pyvenv.cfg"                      # D-02
          test -f "$APP/Contents/Resources/stephany-editor.icns"
          # D-01：Contents/MacOS 底下必須是執行檔（Mach-O），不是 shell 腳本
          file "$APP/Contents/MacOS/stephany-editor" | grep -q "Mach-O"
          # BR-MAC-2：不得帶進建構期的殘留
          ! test -d "$APP/Contents/bin"
          ! find "$APP" -name '__pycache__' -type d | grep -q .
          # F-MAC-12：Qt 的繁中翻譯要跟著進 bundle，否則選單會變英文
          ls "$APP"/Contents/lib/python*/site-packages/PySide6/Qt/translations/qtbase_zh_TW.qm
      - name: 終端機進入點可以執行（F-MAC-05）
        run: |
          "dist/Stephany Editor.app/Contents/Resources/bin/stephany-editor" --version

  windows:
    # SRS-006 NF-W3：字型度量、選單助憶鍵搶走 Alt+C、AppUserModelID——
    # 這些差異在 Linux 上跑一百次也不會發現，與 SRS-005 NF-03 要求 macOS
    # runner 是同一個理由。
    #
    # 這個 job 刻意**不設** QT_QPA_PLATFORM：Windows 的 offscreen 外掛
    # 字型資料庫是空的（實測 0 筆），設了它字型測試會安靜地全部 skip，
    # CI 綠燈但什麼都沒驗到（D-W9）。
    name: Windows（原生平台外掛）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 安裝 Python 相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: 安裝中文補充字型
        # runner 是 en-US 映像，預設沒有 MingLiU／NSimSun／MS Gothic 這些
        # 語言補充字型，字型不變量的測試會因此 skip。裝上去讓它真的跑得到。
        # 裝不起來也不擋 CI——那些測試會自己 skip，不會變成假紅燈。
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($name in @(
              "Language.Fonts.Hant~~~und-US~0.0.1.0",
              "Language.Fonts.Hans~~~und-US~0.0.1.0",
              "Language.Fonts.Jpan~~~und-US~0.0.1.0")) {
            try {
              Add-WindowsCapability -Online -Name $name -ErrorAction Stop
              Write-Host "已安裝 $name"
            } catch {
              Write-Host "略過 $name：$_"
            }
          }
      - name: 這台 runner 看得到哪些偏好字型
        run: |
          python -c "import sys; from PySide6.QtGui import QFontDatabase, QGuiApplication; app = QGuiApplication(sys.argv[:1]); from stephany import platforms; families = QFontDatabase.families(); print(f'字型家族總數：{len(families)}'); [print(('有' if f in families else '無'), f, '/', s or '預設樣式') for f, s in platforms.PREFERRED_FONTS]"
      - name: 執行全套測試
        run: python -m pytest tests -q -rs

  windows-build:
    # F-WIN-10：建構腳本必須在乾淨的 Windows 上、沒有任何額外打包工具、
    # 不需要系統管理員的情況下跑得起來，並產出符合 D-W1／D-W2 的結構。
    name: Windows 安裝建構
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 建置安裝目錄
        run: python packaging/build-win.py
      - name: 驗證結構
        shell: pwsh
        run: |
          $dist = "dist/StephanyEditor"
          # D-W1：要有自己的執行檔，不能只靠 pythonw
          if (-not (Test-Path "$dist/Scripts/stephany-editor.exe")) { throw "缺少專屬執行檔" }
          if (-not (Test-Path "$dist/Scripts/stephany-editor-cli.exe")) { throw "缺少終端機執行檔" }
          if (-not (Test-Path "$dist/stephany-editor.ico")) { throw "缺少圖示" }
          if (-not (Test-Path "$dist/pyvenv.cfg")) { throw "venv 標記不見了" }
          # BR-WIN-2：不得帶進建構期的殘留
          if (Test-Path "$dist/Lib/site-packages/pip") { throw "pip 不該被打包進去" }
          if (Test-Path "$dist/Include") { throw "venv 鷹架不該被打包進去" }
          if (Get-ChildItem $dist -Recurse -Filter "__pycache__" -Directory) { throw "有 __pycache__ 殘留" }
          if (Get-ChildItem "$dist/Scripts" -Filter "pyside6-*.exe") { throw "開發工具不該被打包進去" }
      - name: 終端機進入點可以執行（F-WIN-05）
        run: dist/StephanyEditor/Scripts/stephany-editor-cli.exe -m stephany --version
      - name: 建構期的測試（會檢查建出來的那棵樹）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest tests/test_packaging_windows.py -q -rs
